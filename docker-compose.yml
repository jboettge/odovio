# Portainer: Stacks → Add stack → Repository
#   Compose path: docker-compose.yml
#   Env: siehe .env.example (DB_PASSWORD, APP_DB_PASSWORD, OIDC_ISSUER, ANCHOR_SIGNING_KEY, API_BIND …)
# Valkey (gemeinsamer Zustand) läuft standardmässig mit (STATE_BACKEND=redis, VALKEY_PASSWORD Pflicht).
# Vertikal skalieren (ein Host, mehrere Worker): WEB_CONCURRENCY=auto|N (+ Ressourcen, PG-Tuning)
x-api: &api
  # Kontext fahrzeugbuch/: Stufe 1 baut das Web-Frontend (web/), Stufe 2 die API (server/)
  build:
    context: .
    dockerfile: server/Dockerfile
  image: fahrzeugbuch-api:latest
  read_only: true
  # nur Python-Tempdateien (Uploads liegen im Volume, PDFs im Speicher): klein, nicht ausführbar
  tmpfs: ["/tmp:size=16m,mode=1777,noexec,nosuid,nodev"]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  init: true                     # PID 1 = tini: Signale weiterleiten, Zombies einsammeln
  ulimits:
    nofile: {soft: 16384, hard: 32768}

services:
  db:
    # per Digest gepinnt (Update: docker pull postgres:17-alpine → RepoDigests)
    image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
    container_name: fahrzeugbuch-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: fahrzeugbuch
      POSTGRES_USER: fahrzeugbuch          # Owner/Superuser – nur für Migration und Backup
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD fehlt}
    # Tuning per Env (Defaults konservativ für ≈ 1 GB RAM; Werte für 8/16/32 GB siehe .env.example)
    command:
      - postgres
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-100}
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-256MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-768MB}
      - -c
      - work_mem=${PG_WORK_MEM:-4MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-64MB}
      - -c
      - max_worker_processes=${PG_MAX_WORKER_PROCESSES:-8}
      - -c
      - max_parallel_workers=${PG_MAX_PARALLEL_WORKERS:-2}
      - -c
      - max_parallel_workers_per_gather=${PG_MAX_PARALLEL_WORKERS_PER_GATHER:-1}
      - -c
      - max_parallel_maintenance_workers=${PG_MAX_PARALLEL_MAINTENANCE_WORKERS:-1}
      - -c
      - wal_buffers=${PG_WAL_BUFFERS:-8MB}
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - max_wal_size=${PG_MAX_WAL_SIZE:-1GB}
    # shared_buffers liegen im gemeinsamen Speicher; /dev/shm für parallele Abfragen (≥ 256 MB)
    shm_size: ${PG_SHM_SIZE:-256mb}
    volumes:
      - fahrzeugbuch-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fahrzeugbuch -d fahrzeugbuch"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          cpus: "${DB_CPUS:-2}"
          memory: ${DB_MEMORY:-1g}
    networks: [internal]

  # Einmalig je Deploy: Schema (Alembic upgrade head)/Trigger als Owner, App-Rolle ohne Owner-/Superuser-Rechte
  migrate:
    <<: *api
    container_name: fahrzeugbuch-migrate
    command: ["python", "-m", "app.migrate"]
    restart: "no"
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://fahrzeugbuch:${DB_PASSWORD}@db:5432/fahrzeugbuch
      DATABASE_URL: postgresql+psycopg://fahrzeugbuch_app:${APP_DB_PASSWORD:?APP_DB_PASSWORD fehlt}@db:5432/fahrzeugbuch
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  api:
    <<: *api
    container_name: fahrzeugbuch-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://fahrzeugbuch_app:${APP_DB_PASSWORD}@db:5432/fahrzeugbuch
      AUTO_MIGRATE: "0"
      OIDC_ISSUER: ${OIDC_ISSUER:?OIDC_ISSUER fehlt}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-fahrzeugbuch-ios}
      # Web-Frontend: immer als azp zugelassen; nur dort Mitgliederverwaltung und Steuerparameter
      OIDC_WEB_CLIENT_ID: ${OIDC_WEB_CLIENT_ID:-fahrzeugbuch-web}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_REQUIRED_ROLE: ${OIDC_REQUIRED_ROLE:-}
      TENANT_GROUP_PREFIX: ${TENANT_GROUP_PREFIX:-/fahrzeugbuch/}
      DEFAULT_TENANT: ${DEFAULT_TENANT:-}
      # Mitgliederverwaltung über die Keycloak-Admin-API (optional; URL/Realm leer → aus OIDC_ISSUER)
      KC_ADMIN_URL: ${KC_ADMIN_URL:-}
      KC_ADMIN_REALM: ${KC_ADMIN_REALM:-}
      KC_ADMIN_CLIENT_ID: ${KC_ADMIN_CLIENT_ID:-}
      KC_ADMIN_CLIENT_SECRET: ${KC_ADMIN_CLIENT_SECRET:-}
      KC_ADMIN_TIMEOUT_S: ${KC_ADMIN_TIMEOUT_S:-5}
      ANCHOR_SIGNING_KEY: ${ANCHOR_SIGNING_KEY:-}
      # alte Public Keys nach Schlüsselwechsel (Base64, kommagetrennt) – alte Anker bleiben prüfbar
      ANCHOR_PUBLIC_KEYS: ${ANCHOR_PUBLIC_KEYS:-}
      ANCHOR_INTERVAL_MIN: ${ANCHOR_INTERVAL_MIN:-60}
      VERIFY_FULL_INTERVAL_S: ${VERIFY_FULL_INTERVAL_S:-86400}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Zurich}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-1048576}
      # Belege (Fotos/PDF): Ablage im Volume fahrzeugbuch-files, Upload-Limit nur für …/blob
      FILES_DIR: /data/attachments
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-8388608}
      ATTACHMENT_QUOTA_MB: ${ATTACHMENT_QUOTA_MB:-2048}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      DOCS_ENABLED: ${DOCS_ENABLED:-0}
      # ---------- Härtung (app/security.py) ----------
      # Host-Header (127.0.0.1/localhost sind für den Healthcheck immer erlaubt); "*" → Startwarnung
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-www.odovio.ch,localhost}
      # exakte Cross-Origin-Origins (leer = keine; das Web-Frontend läuft same-origin)
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      FORCE_HSTS: ${FORCE_HSTS:-0}
      # STATE_BACKEND=memory: je Prozess (1 Worker); redis: gemeinsam für alle Worker
      RATE_IP_PER_MIN: ${RATE_IP_PER_MIN:-600}
      RATE_PUBLIC_PER_MIN: ${RATE_PUBLIC_PER_MIN:-120}
      RATE_WEB_PER_MIN: ${RATE_WEB_PER_MIN:-3000}
      RATE_USER_PER_MIN: ${RATE_USER_PER_MIN:-1200}
      BRUTE_401_THRESHOLD: ${BRUTE_401_THRESHOLD:-20}
      BRUTE_403_THRESHOLD: ${BRUTE_403_THRESHOLD:-30}
      BRUTE_WINDOW_S: ${BRUTE_WINDOW_S:-300}
      BRUTE_BACKOFF_S: ${BRUTE_BACKOFF_S:-300,900,3600}
      SECURITY_ALLOWLIST: ${SECURITY_ALLOWLIST:-}
      MAX_TOKEN_LIFETIME_S: ${MAX_TOKEN_LIFETIME_S:-3600}
      JSON_MAX_DEPTH: ${JSON_MAX_DEPTH:-32}
      JSON_MAX_ITEMS: ${JSON_MAX_ITEMS:-100000}
      # 1 → unsichere Konfiguration (siehe Sicherheits-Log config_warning) verhindert den Start
      STRICT_CONFIG: ${STRICT_CONFIG:-0}
      # ---------- Skalierung (app/serve.py, app/state.py, app/db.py) ----------
      # Worker je Container: 1 | N | auto (= min(2 × cpus-Limit, 16)); > 1 nur mit STATE_BACKEND=redis
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      UVICORN_LIMIT_CONCURRENCY: ${UVICORN_LIMIT_CONCURRENCY:-200}
      UVICORN_LIMIT_MAX_REQUESTS: ${UVICORN_LIMIT_MAX_REQUESTS:-0}
      GRACEFUL_TIMEOUT_S: ${GRACEFUL_TIMEOUT_S:-25}
      THREADPOOL_SIZE: ${THREADPOOL_SIZE:-40}
      PDF_CONCURRENCY: ${PDF_CONCURRENCY:-2}
      # redis (Valkey, Standard) | memory (Einzelbetrieb ohne Valkey, nur 1 Worker)
      STATE_BACKEND: ${STATE_BACKEND:-redis}
      REDIS_URL: ${REDIS_URL:-redis://valkey:6379/0}
      REDIS_PASSWORD: ${VALKEY_PASSWORD:-}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-30000}
      DB_IDLE_IN_TRANSACTION_TIMEOUT_MS: ${DB_IDLE_IN_TRANSACTION_TIMEOUT_MS:-60000}
      DB_DISABLE_PREPARED: ${DB_DISABLE_PREPARED:-0}
      # Startprüfung: WEB_CONCURRENCY × (DB_POOL_SIZE + DB_MAX_OVERFLOW) + Reserve ≤ PG_MAX_CONNECTIONS
      PG_MAX_CONNECTIONS: ${PG_MAX_CONNECTIONS:-100}
      DB_CONNECTION_RESERVE: ${DB_CONNECTION_RESERVE:-10}
      # Prometheus: /metrics nur mit Bearer-Token oder aus diesen CIDRs (sonst 404)
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      METRICS_ALLOW: ${METRICS_ALLOW:-}
      # Belegspeicher: fs (Volume unten) | s3 (S3_ENDPOINT, S3_BUCKET, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY …)
      STORAGE_BACKEND: ${STORAGE_BACKEND:-fs}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_PREFIX: ${S3_PREFIX:-attachments/}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      # Intelligente Dienste (optional, leer = aus). OSRM/vLLM laufen beim Nutzer als eigene Container:
      # erreichbar über das default-Netz per Host-IP bzw. host.docker.internal (siehe extra_hosts).
      OSRM_URL: ${OSRM_URL:-}
      OSRM_PROFILE: ${OSRM_PROFILE:-driving}
      OSRM_MAX_MATCHING_SIZE: ${OSRM_MAX_MATCHING_SIZE:-100}
      PHOTON_URL: ${PHOTON_URL:-}
      VLLM_URL: ${VLLM_URL:-}
      VLLM_MODEL: ${VLLM_MODEL:-qwen3.5-9b}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      # Bildauswertung (Vision-Modell); URL leer → VLLM_URL, Modell leer → aus
      VLLM_VISION_URL: ${VLLM_VISION_URL:-}
      VLLM_VISION_MODEL: ${VLLM_VISION_MODEL:-}
      GEO_TIMEOUT_S: ${GEO_TIMEOUT_S:-5}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-10}
      INTEL_RATE_SUGGEST: ${INTEL_RATE_SUGGEST:-60}
      INTEL_RATE_GEO: ${INTEL_RATE_GEO:-30}
      INTEL_RATE_SCAN: ${INTEL_RATE_SCAN:-20}
      UPSTREAM_CONCURRENCY: ${UPSTREAM_CONCURRENCY:-4}
      UPSTREAM_BREAKER_FAILURES: ${UPSTREAM_BREAKER_FAILURES:-3}
      UPSTREAM_BREAKER_OPEN_S: ${UPSTREAM_BREAKER_OPEN_S:-30}
      RATE_REPORTS: ${RATE_REPORTS:-20}
      RATE_VERIFY: ${RATE_VERIFY:-10}
      RATE_FULL_SYNC: ${RATE_FULL_SYNC:-10}
      RATE_ACTIVITY: ${RATE_ACTIVITY:-60}
      RATE_MEMBERS: ${RATE_MEMBERS:-30}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-}
      TAX_CANTON: ${TAX_CANTON:-}
      # CHECKLIST_FILE: /config/checklists.json
    volumes:
      # Container ist read_only: Belege nur hier beschreibbar (Backup zusammen mit der DB!)
      - fahrzeugbuch-files:/data/attachments
    #   - ./checklists.json:/config/checklists.json:ro
    ports:
      # Nur für den Reverse Proxy freigeben: API_BIND = IP der Docker-VM (+ Firewall nur OPNsense)
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8085}:8000"
    deploy:
      resources:
        limits:
          cpus: "${API_CPUS:-2}"
          memory: ${API_MEMORY:-1g}
          pids: ${API_PIDS_LIMIT:-1024}     # Threads zählen als PIDs: je Worker ≈ THREADPOOL_SIZE + 10
    # SIGTERM → laufende Anfragen bis GRACEFUL_TIMEOUT_S fertigstellen
    stop_grace_period: ${API_STOP_GRACE:-30s}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    # Dienste auf dem Docker-Host (z. B. OSRM/vLLM mit veröffentlichtem Port): http://host.docker.internal:<port>
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [internal, default]

  # Gemeinsamer, flüchtiger Zustand (Rate-Limits, Brute-Force-Sperren, Circuit-Breaker, Metrik-Schnappschüsse)
  # für alle Worker – standardmässig aktiv: VALKEY_PASSWORD (openssl rand -hex 32) setzen.
  # Keine Persistenz (Neustart = Limits/Sperren zurückgesetzt, beabsichtigt), maxmemory + allkeys-lru,
  # nur internes Netz, read-only, ohne Capabilities. Digest-Update: docker pull valkey/valkey:8-alpine
  valkey:
    image: valkey/valkey:8-alpine@sha256:9971099af41c36e887aabdfe22b80c0fe45df949163dfc9cb434febc57cfc3fc
    container_name: fahrzeugbuch-valkey
    restart: unless-stopped
    user: "999:1000"               # valkey-Benutzer des Images (kein chown/setpriv nötig → cap_drop ALL)
    # Passwort Pflicht (ohne → Abbruch)
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        [ -n "$$VALKEY_PASSWORD" ] || { echo "VALKEY_PASSWORD fehlt" >&2; exit 1; };
        exec valkey-server --requirepass "$$VALKEY_PASSWORD" --save "" --appendonly no
        --maxmemory "$$VALKEY_MAXMEMORY" --maxmemory-policy allkeys-lru --protected-mode yes
        --io-threads "$$VALKEY_IO_THREADS"
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:-}
      VALKEY_MAXMEMORY: ${VALKEY_MAXMEMORY:-256mb}
      VALKEY_IO_THREADS: ${VALKEY_IO_THREADS:-2}
      REDISCLI_AUTH: ${VALKEY_PASSWORD:-}     # nur für den Healthcheck (valkey-cli)
    read_only: true
    tmpfs: ["/tmp:size=8m,mode=1777,noexec,nosuid,nodev"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ulimits:
      nofile: {soft: 10032, hard: 10032}
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "${VALKEY_CPUS:-1}"
          memory: ${VALKEY_MEMORY:-384m}
    networks: [internal]

  # OPTIONAL – Reverse-Geocoding (Photon, CH-Extrakt). Start nur mit Profil:
  #   docker compose --profile geo up -d photon      →  PHOTON_URL=http://photon:2322
  # Kein offizielles Image von komoot; rtuszik/photon-docker (lädt den Länderextrakt selbst).
  # Version + Digest gepinnt; vor einem Update Variablennamen gemäss README des Images prüfen.
  # Nur internes Netz, keine Ports: für den Erst-Download/Updates braucht der Container Internet –
  # dafür vorübergehend `default` bei networks ergänzen oder die Daten ins Volume kopieren.
  photon:
    image: rtuszik/photon-docker:2.5.0@sha256:c5babeb0ac396b485822036cf3c69e54fb6c79d699328a4e042e11bbd6f73f1a
    container_name: fahrzeugbuch-photon
    profiles: ["geo"]
    restart: unless-stopped
    environment:
      REGION: ch
      UPDATE_STRATEGY: SEQUENTIAL
      UPDATE_INTERVAL: 30d
    volumes:
      - fahrzeugbuch-photon:/photon/data
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    networks: [internal]

volumes:
  fahrzeugbuch-db:
  fahrzeugbuch-files:
  fahrzeugbuch-photon:

networks:
  internal:
    internal: true
