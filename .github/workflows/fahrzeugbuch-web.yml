name: fahrzeugbuch-web
on:
  push:
    paths: ["web/**", ".github/workflows/fahrzeugbuch-web.yml"]
  pull_request:
    paths: ["web/**", ".github/workflows/fahrzeugbuch-web.yml"]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
      - name: Node-Version
        run: node --version && npm --version
      - name: Abhängigkeiten (Lockfile, ohne Install-Skripte)
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit-Tests
        run: npm test
      - name: Build (inkl. vorkomprimierter .br/.gz)
        run: npm run build
      - name: Bundle-Budget (gzip), keine Source-Maps, Vorkomprimierung verlustfrei
        run: npm run size
      - name: Abhängigkeiten auf Schwachstellen prüfen
        run: npm run audit
      - name: Playwright-Browser
        run: npx playwright install --with-deps chromium
      - name: E2E-Tests (Mock, Produktions-CSP)
        run: npx playwright test --trace off --project functional
      - name: E2E-Performance (grosser Datenbestand, Budgets)
        run: npm run e2e:perf
