name: fahrzeugbuch
on:
  push:
    paths: ["fahrzeugbuch/**", ".github/workflows/fahrzeugbuch.yml"]
  pull_request:
    paths: ["fahrzeugbuch/**", ".github/workflows/fahrzeugbuch.yml"]

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fzb
          POSTGRES_PASSWORD: fzb
          POSTGRES_DB: fzb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fzb" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: fahrzeugbuch/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-test.txt
      - name: Tests (SQLite)
        run: pytest -q
      - name: Tests (PostgreSQL)
        env:
          FZB_TEST_DATABASE_URL: postgresql+psycopg://fzb:fzb@localhost:5432/fzb
        run: pytest -q
      - name: Docker-Build
        run: docker build -t fahrzeugbuch-api:ci .

  ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: fahrzeugbuch/ios
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build (Simulator, ohne Signierung)
        run: |
          xcodebuild -project Fahrzeugbuch.xcodeproj -target Fahrzeugbuch \
            -sdk iphonesimulator -configuration Debug \
            CODE_SIGNING_ALLOWED=NO build | tail -40
          exit ${PIPESTATUS[0]}
