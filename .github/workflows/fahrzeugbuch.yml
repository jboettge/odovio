name: fahrzeugbuch
on:
  push:
    paths: ["**", ".github/workflows/fahrzeugbuch.yml"]
  pull_request:
    paths: ["**", ".github/workflows/fahrzeugbuch.yml"]

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
        env:
          POSTGRES_USER: fzb
          POSTGRES_PASSWORD: fzb
          POSTGRES_DB: fzb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fzb" --health-interval 5s --health-timeout 5s --health-retries 10
      # gemeinsamer Zustand (STATE_BACKEND=redis) – gleicher Digest wie docker-compose.yml
      valkey:
        image: valkey/valkey:8-alpine@sha256:9971099af41c36e887aabdfe22b80c0fe45df949163dfc9cb434febc57cfc3fc
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      # S3-kompatibler Belegspeicher (STORAGE_BACKEND=s3), RustFS 1.0.6
      s3:
        image: rustfs/rustfs@sha256:ee717072290bec9b11abfc0365f8310b00df1cd9b3639943edae47bdef05044a
        env:
          RUSTFS_ACCESS_KEY: fzbtestaccess
          RUSTFS_SECRET_KEY: fzbtestsecret123
          RUSTFS_CONSOLE_ENABLE: "false"
        ports: ["9000:9000"]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Abhängigkeiten (Lock-Datei mit Hashes)
        run: |
          pip install --require-hashes --no-deps -r requirements.txt
          pip install -r requirements-test.txt
      - name: Lint (ruff)
        run: ruff check app tests alembic loadtest
      - name: Lint (bandit, Schweregrad ≥ mittel)
        run: bandit -r app -q -ll
      - name: Schwachstellen in Abhängigkeiten (pip-audit, Lock-Datei mit Hashes)
        run: |
          python -m venv /tmp/audit && /tmp/audit/bin/pip install -q pip-audit==2.10.1
          # Ausnahmen nur mit Begründung: Zeile "<ID>  # <Begründung>" in pip-audit-ignore.txt
          args=()
          while IFS= read -r line || [[ -n "$line" ]]; do
            [[ -z "${line//[[:space:]]/}" || "$line" =~ ^[[:space:]]*# ]] && continue
            id=${line%%[[:space:]#]*}
            reason=${line#*#}
            if [[ "$line" != *"#"* || -z "${reason//[[:space:]]/}" ]]; then
              echo "::error file=server/pip-audit-ignore.txt::Ausnahme $id ohne Begründung"; exit 1
            fi
            args+=(--ignore-vuln "$id")
          done < pip-audit-ignore.txt
          /tmp/audit/bin/pip-audit -r requirements.txt --require-hashes --progress-spinner off "${args[@]}"
      - name: Lock-Datei passt zu requirements.in
        run: |
          python -m venv /tmp/piptools && /tmp/piptools/bin/pip install -q pip-tools==7.7.0
          cp requirements.txt /tmp/req.txt
          /tmp/piptools/bin/pip-compile --generate-hashes --allow-unsafe --strip-extras -q -o /tmp/req.txt requirements.in
          diff <(grep -E '^[a-z]' requirements.txt) <(grep -E '^[a-z]' /tmp/req.txt)
      - name: Tests (SQLite)
        run: pytest -q
      - name: Tests (PostgreSQL + Valkey + S3, inkl. Mehrprozess-E2E mit 2 uvicorn-Workern)
        env:
          FZB_TEST_DATABASE_URL: postgresql+psycopg://fzb:fzb@localhost:5432/fzb
          FZB_TEST_REDIS_URL: redis://localhost:6379/0
          FZB_TEST_S3_ENDPOINT: http://localhost:9000
          FZB_TEST_S3_ACCESS_KEY: fzbtestaccess
          FZB_TEST_S3_SECRET_KEY: fzbtestsecret123
        run: |
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:9000/ && break; sleep 1; done
          pytest -q -rs
      - name: Docker-Build (Web-Frontend + API, Kontext Repo-Root)
        working-directory: .
        run: docker build -f server/Dockerfile -t fahrzeugbuch-api:ci .

  ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build + Unit-Tests (Simulator, ohne Signierung)
        run: |
          DEST=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devs = [d for rt, ds in json.load(sys.stdin)["devices"].items() if "iOS" in rt for d in ds]
          pick = next((d for d in devs if d["name"] == "iPhone 16 Pro"), None) or next(d for d in devs if d["name"].startswith("iPhone"))
          print(pick["udid"])')
          set +e
          xcodebuild test -project Fahrzeugbuch.xcodeproj -scheme Fahrzeugbuch \
            -destination "id=$DEST" CODE_SIGNING_ALLOWED=NO > build.log 2>&1
          rc=$?
          tail -40 build.log
          echo "::group::Compiler-/Testfehler"
          grep -E "error:|: error|Test Case .* failed|XCTAssert" build.log | sort -u | head -150
          echo "::endgroup::"
          exit $rc
