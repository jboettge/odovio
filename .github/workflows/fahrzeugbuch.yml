name: fahrzeugbuch
on:
  push:
    paths: ["fahrzeugbuch/**", ".github/workflows/fahrzeugbuch.yml"]
  pull_request:
    paths: ["fahrzeugbuch/**", ".github/workflows/fahrzeugbuch.yml"]

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
        env:
          POSTGRES_USER: fzb
          POSTGRES_PASSWORD: fzb
          POSTGRES_DB: fzb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fzb" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: fahrzeugbuch/server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Abhängigkeiten (Lock-Datei mit Hashes)
        run: |
          pip install --require-hashes --no-deps -r requirements.txt
          pip install -r requirements-test.txt
      - name: Lint (ruff)
        run: ruff check app tests alembic
      - name: Lock-Datei passt zu requirements.in
        run: |
          python -m venv /tmp/piptools && /tmp/piptools/bin/pip install -q pip-tools==7.7.0
          cp requirements.txt /tmp/req.txt
          /tmp/piptools/bin/pip-compile --generate-hashes --allow-unsafe --strip-extras -q -o /tmp/req.txt requirements.in
          diff <(grep -E '^[a-z]' requirements.txt) <(grep -E '^[a-z]' /tmp/req.txt)
      - name: Tests (SQLite)
        run: pytest -q
      - name: Tests (PostgreSQL)
        env:
          FZB_TEST_DATABASE_URL: postgresql+psycopg://fzb:fzb@localhost:5432/fzb
        run: pytest -q
      - name: Docker-Build
        run: docker build -t fahrzeugbuch-api:ci .

  ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: fahrzeugbuch/ios
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build + Unit-Tests (Simulator, ohne Signierung)
        run: |
          DEST=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devs = [d for rt, ds in json.load(sys.stdin)["devices"].items() if "iOS" in rt for d in ds]
          pick = next((d for d in devs if d["name"] == "iPhone 16 Pro"), None) or next(d for d in devs if d["name"].startswith("iPhone"))
          print(pick["udid"])')
          set +e
          xcodebuild test -project Fahrzeugbuch.xcodeproj -scheme Fahrzeugbuch \
            -destination "id=$DEST" CODE_SIGNING_ALLOWED=NO > build.log 2>&1
          rc=$?
          tail -40 build.log
          echo "::group::Compiler-/Testfehler"
          grep -E "error:|: error|Test Case .* failed|XCTAssert" build.log | sort -u | head -150
          echo "::endgroup::"
          exit $rc
