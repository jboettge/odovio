name: fahrzeugbuch-screenshots
# Nur manuell (Actions → fahrzeugbuch-screenshots → Run workflow, Feature-Branch wählen):
# macOS-Lauf ≈ 15 min (privates Repo: 10-fach gezählt). Schreibt zurück → nie auf main.
on:
  workflow_dispatch:

permissions:
  contents: write   # Screenshots werden auf denselben (Feature-)Branch committet

# Nur der neueste Lauf je Branch zählt (spart macOS-Minuten, verhindert Push-Konflikte paralleler Läufe)
concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build (Debug, Simulator)
        run: |
          xcodebuild -project Fahrzeugbuch.xcodeproj -target Fahrzeugbuch -sdk iphonesimulator \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build | tail -5
          exit ${PIPESTATUS[0]}
      - name: Simulator starten
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devs = [d for rt, ds in json.load(sys.stdin)["devices"].items() if "iOS" in rt for d in ds]
          pick = next((d for d in devs if d["name"] == "iPhone 16 Pro"), None) or next(d for d in devs if d["name"].startswith("iPhone"))
          print(pick["udid"])')
          echo "UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 \
            --cellularMode active --cellularBars 4 --wifiBars 3
          xcrun simctl install "$UDID" build/Debug-iphonesimulator/Fahrzeugbuch.app
      - name: Screenshots
        run: |
          mkdir -p shots
          shoot() {  # $1 = Screen, $2 = Dateiname
            xcrun simctl launch --terminate-running-process "$UDID" ch.odovio \
              -demo -screen "$1" -AppleLanguages "(de-CH)" -AppleLocale de_CH >/dev/null
            sleep 4
            xcrun simctl io "$UDID" screenshot --type=png "shots/$2.png" >/dev/null
          }
          for s in list overview trips trips-recording trip-review trip-form gaps month-close trip-reports places rules tax-params fuel fuel-scan fuel-attachments maintenance maintenance-detail maintenance-edit catalog material-picker odometer onboarding home-place rejected month-close-confirm glossary mode-choice local-list local-settings members activity migrate fuel-form maintenance-form report settings login; do
            shoot "$s" "$s"
          done
          xcrun simctl ui "$UDID" appearance dark
          for s in list overview maintenance-detail; do shoot "$s" "dark-$s"; done
          ls -la shots
      - name: Verkleinern
        run: |
          mkdir -p ../docs/screenshots
          for f in shots/*.png; do
            sips -s format jpeg -s formatOptions 80 -Z 1000 "$f" --out "../docs/screenshots/$(basename "${f%.png}").jpg" >/dev/null
          done
          ls -la ../docs/screenshots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: fahrzeugbuch-screenshots
          path: ios/shots/
          retention-days: 14
      - name: Screenshots committen (nicht auf main)
        if: github.ref != 'refs/heads/main'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git diff --cached --quiet && exit 0
          git commit -m "Fahrzeugbuch: Screenshots aktualisiert [skip ci]"
          # Binärkonflikte (paralleler Lauf hat Screenshots committet): eigene, neuere Screenshots gewinnen
          git pull --rebase -X theirs origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
