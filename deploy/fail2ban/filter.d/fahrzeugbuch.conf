# fail2ban-Filter für das Sicherheits-Log der Fahrzeugbuch-API (Logger fahrzeugbuch.security, JSON-Zeilen).
# Passt auf rohe JSON-Zeilen (journald/Datei) und auf die escaped Form im Docker-json-file-Log
# ({"log":"{\"ts\":…}\n",…}). Feldreihenfolge ist fest: ts, logger, event, ip, …
# Test: fail2ban-regex /var/lib/docker/containers/<id>/<id>-json.log /etc/fail2ban/filter.d/fahrzeugbuch.conf
[Definition]
_q = \\?"
failregex = ^.*%(_q)slogger%(_q)s:%(_q)sfahrzeugbuch\.security%(_q)s,%(_q)sevent%(_q)s:%(_q)s(?:auth_failed|brute_force_block|rate_limited)%(_q)s,%(_q)sip%(_q)s:%(_q)s<ADDR>%(_q)s
ignoreregex =
# Zeitstempel aus dem Feld "ts" (UTC)
datepattern = ^.*"ts\\?":\s*\\?"%%Y-%%m-%%dT%%H:%%M:%%S
