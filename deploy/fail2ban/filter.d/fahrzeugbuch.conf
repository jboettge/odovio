# fail2ban-Filter für das Sicherheits-Log der Fahrzeugbuch-API (Logger fahrzeugbuch.security, JSON-Zeilen).
#
# Nur Zeilen, die am ZEILENANFANG mit dem Sicherheits-Log der API beginnen; Feldreihenfolge fest (ts, logger,
# event, ip, …), alle vier Werte setzt der Server (ip = geprüfte Client-IP). Nutzereingaben (Pfad, Host, Origin …)
# stehen erst dahinter – der Pfad zudem URL-kodiert, ohne `"` – und können daher keine fremde IP einschleusen.
# Kein ^.* : eine Zeile eines anderen Prozesses/Containers, die das Muster irgendwo enthält, passt nie.
#
# Formen (fail2ban entfernt den per datepattern gefundenen Zeitstempel vor failregex aus der Zeile):
#   Datei / Docker json-file  {"log":"{\"ts\":\"2026-…T10:00:00.123Z\",\"logger\":…}\n",…}
#                             bzw. roh {"ts":"2026-…T10:00:00.123Z","logger":…}
#                             → nach dem Entfernen von {"log":"{\"ts\":\"2026-…T10:00:00 bleibt .123Z\",\"logger\"…
#   systemd-Journal           <host> <ident>[pid]: {"ts":"2026-…Z","logger":…}   (Zeit liefert das Journal)
# Test: fail2ban-regex /var/lib/docker/containers/<id>/<id>-json.log /etc/fail2ban/filter.d/fahrzeugbuch.conf
#       fail2ban-regex systemd-journal /etc/fail2ban/filter.d/fahrzeugbuch.conf   (Log-Treiber journald)
# Regressionstest (Angriffszeilen): server/tests/test_fail2ban.py
[Definition]
_q = \\?"
_ts = [0-9T:.+-]+Z
_head = ^(?:\.\d{1,6}Z|(?:\S+ )?\S+: \{"ts":"%(_ts)s)
failregex = %(_head)s%(_q)s,%(_q)slogger%(_q)s:%(_q)sfahrzeugbuch\.security%(_q)s,%(_q)sevent%(_q)s:%(_q)s(?:auth_failed|brute_force_block|rate_limited)%(_q)s,%(_q)sip%(_q)s:%(_q)s<ADDR>%(_q)s
ignoreregex =
# Zeitstempel aus dem Feld "ts" (UTC), nur am Zeilenanfang (roh bzw. im Docker-Feld "log")
datepattern = ^(?:\{"log":")?\{\\?"ts\\?":\\?"%%Y-%%m-%%dT%%H:%%M:%%S
