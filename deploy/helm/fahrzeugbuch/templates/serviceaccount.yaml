{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "fahrzeugbuch.serviceAccountName" . }}
  labels:
    {{- include "fahrzeugbuch.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# kein API-Zugriff nötig (keine Rollen); Token wird nicht gemountet
automountServiceAccountToken: false
{{- end }}
