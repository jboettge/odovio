{{- if .Values.vpa.enabled }}
{{- $p := .Values.vpa }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ include "fahrzeugbuch.fullname" . }}
  labels:
    {{- include "fahrzeugbuch.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "fahrzeugbuch.fullname" . }}
  updatePolicy:
    updateMode: {{ toString $p.updateMode | quote }}
    {{- with $p.minReplicas }}
    minReplicas: {{ . }}
    {{- end }}
  resourcePolicy:
    containerPolicies:
      - containerName: api
        controlledResources:
          {{- toYaml $p.controlledResources | nindent 10 }}
        controlledValues: {{ $p.controlledValues }}
        {{- with $p.minAllowed }}
        minAllowed:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with $p.maxAllowed }}
        maxAllowed:
          {{- toYaml . | nindent 10 }}
        {{- end }}
{{- end }}
