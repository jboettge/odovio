{{- $data := include "fahrzeugbuch.api.secretData" . | fromYaml }}
{{- if $data }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fahrzeugbuch.fullname" . }}
  labels:
    {{- include "fahrzeugbuch.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
type: Opaque
stringData:
  {{- range $k, $val := $data }}
  {{ $k }}: {{ $val | quote }}
  {{- end }}
{{- end }}
