name: Fahrzeugbuch
options:
  bundleIdPrefix: net.jmb
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""   # eigenes Team in Xcode wählen
targets:
  Fahrzeugbuch:
    type: application
    platform: iOS
    sources: [Fahrzeugbuch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.jmb.fahrzeugbuch
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    info:
      path: Fahrzeugbuch/Info.plist
      properties:
        CFBundleDisplayName: Fahrzeugbuch
        CFBundleDevelopmentRegion: de
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
