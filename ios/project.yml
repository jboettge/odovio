name: Fahrzeugbuch
options:
  bundleIdPrefix: ch.odovio
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""   # eigenes Team in Xcode wählen
targets:
  Fahrzeugbuch:
    type: application
    platform: iOS
    sources: [Fahrzeugbuch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.odovio
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Fahrzeugbuch/Info.plist
      properties:
        CFBundleDisplayName: Fahrzeugbuch
        CFBundleDevelopmentRegion: de
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Einrichtung per Link/QR: fahrzeugbuch://setup?server=https://…
        # (das OIDC-Callback-Schema ch.odovio behandelt ASWebAuthenticationSession – nicht hier eintragen)
        CFBundleURLTypes:
          - CFBundleURLName: ch.odovio.setup
            CFBundleURLSchemes: [fahrzeugbuch]
        # Home-Screen-Quick-Actions (Behandlung: AppDelegate/QuickAction in AppRouter.swift)
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: ch.odovio.addFuel
            UIApplicationShortcutItemTitle: Tanken
            UIApplicationShortcutItemSubtitle: Tankvorgang erfassen
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypeAdd
          - UIApplicationShortcutItemType: ch.odovio.startTrip
            UIApplicationShortcutItemTitle: Fahrt starten
            UIApplicationShortcutItemSubtitle: Mit dem Standardfahrzeug
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypePlay
        # Intelligentes Fahrtenbuch (ios/Fahrzeugbuch/Trips)
        NSLocationWhenInUseUsageDescription: >-
          Das Fahrtenbuch nutzt deinen Standort nur während einer Fahrt, um Distanz sowie Start- und Zielort
          zu erfassen. Die GPS-Rohdaten bleiben auf diesem iPhone und werden 30 Tage nach Bestätigung der
          Fahrt gelöscht. Im Privatmodus wird kein Track gespeichert.
        NSLocationAlwaysAndWhenInUseUsageDescription: >-
          Mit „Immer“ erkennt das Fahrtenbuch Fahrten automatisch und zeichnet sie auch bei gesperrtem iPhone
          auf. Ausserhalb von Fahrten wird nur grob erkannt, ob du losfährst (bekannte Orte, wesentliche
          Standortänderungen) – kein Bewegungsprofil. Die Rohdaten bleiben auf dem Gerät; dein
          Fahrzeugbuch-Server erhält Start/Ziel als Adresse, die Distanz und zur Strassendistanz-Berechnung
          den reduzierten Track ohne Wohnort-Umgebung und ohne die ersten/letzten 200 m (dort nicht gespeichert).
        NSMotionUsageDescription: >-
          Bewegungsdaten („im Auto“, „stillstehend“, „gehend“) werden nur auf dem iPhone ausgewertet, um
          Beginn und Ende einer Fahrt automatisch zu erkennen. Sie verlassen das Gerät nicht.
        NSCalendarsFullAccessUsageDescription: >-
          Termine werden nur auf dem iPhone gelesen, um zu einer Fahrt den passenden Termin als Zweck
          vorzuschlagen. Kalenderinhalte werden nicht übertragen – übernommen wird höchstens der Termintitel
          als Zweckvorschlag der jeweiligen Fahrt. Der Kalender wird nie verändert.
        # Scan von Zapfsäule, Quittung und Tacho (ios/Fahrzeugbuch/Scan)
        NSCameraUsageDescription: >-
          Die Kamera wird nur verwendet, um Zapfsäule, Tankquittung oder Tacho zu fotografieren. Die
          Texterkennung läuft auf diesem iPhone. Ein Foto verlässt das Gerät nur, wenn du es als Beleg
          speicherst (Übertragung auf deinen Fahrzeugbuch-Server) oder ausdrücklich „Mit KI auswerten“ wählst.
        UIBackgroundModes: [location]
  FahrzeugbuchTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/FahrzeugbuchTests]
    dependencies:
      - target: Fahrzeugbuch
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: ch.odovio.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Fahrzeugbuch.app/Fahrzeugbuch"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic
schemes:
  Fahrzeugbuch:
    build:
      targets:
        Fahrzeugbuch: all
        FahrzeugbuchTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FahrzeugbuchTests
    archive:
      config: Release
